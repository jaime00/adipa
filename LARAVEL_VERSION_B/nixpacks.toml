[phases.setup]
nixPkgs = ["php82", "php82Extensions.tokenizer", "php82Extensions.dom", "php82Extensions.xml", "php82Extensions.mbstring", "php82Extensions.curl", "php82Extensions.openssl", "php82Extensions.fileinfo", "nodejs_18"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader", "npm install"]

[phases.build]
cmds = [
    "npm run prod",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
